[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mechman-sales-meeting-crm"
version = "3.0.0"
description = "Official WABA sales-meeting CRM for Mechman Solutions"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30.0",
  "bcrypt>=4.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "PyJWT>=2.15.1",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest-asyncio>=0.25.0",
  "pytest>=8.0",
  "ruff>=0.11.0",
]

[project.scripts]
mechman-dashboard = "mechman_bot.web:run"

[tool.setuptools.packages.find]
include = ["mechman_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
